name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # Alseny travaille sous Windows
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Installation en mode développement
        run: pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest
      # Ce que fera chaque dépôt de parcours : installer le moteur comme un paquet,
      # dans un environnement neuf, puis appeler la commande `moteur`.
      - name: Installation comme un dépôt de parcours
        if: runner.os == 'Linux'
        run: |
          python -m venv /tmp/parcours
          /tmp/parcours/bin/pip install .
          /tmp/parcours/bin/moteur --version
      # Le modèle (style, JS, MathJax, polices, Pyodide) doit être installé avec le paquet :
      # on construit le parcours d'exemple depuis un autre dossier, avec le moteur installé.
      - name: Construction du parcours d'exemple avec le moteur installé
        if: runner.os == 'Linux'
        working-directory: /tmp
        run: |
          /tmp/parcours/bin/moteur verifier --dossier "$GITHUB_WORKSPACE/tests/exemple"
          /tmp/parcours/bin/moteur construire --dossier "$GITHUB_WORKSPACE/tests/exemple" --sortie /tmp/site
          test -f /tmp/site/assets/pyodide/pyodide.asm.wasm
          test -f /tmp/site/assets/mathjax/tex-svg.js
          test -f /tmp/site/chapitre-1.html
